# lamasery configuration
#
# lamasery looks for `lamasery.yaml` next to its own binary, or takes
# `--config <file>`. Relative paths are relative to this file's directory.
#
# Anywhere a path or argument is written you can use:
#   ~/...        your home directory
#   ${name}      a value from `vars` below, or an environment variable

# Path to the llama-server binary.
llama_server: ${llama}/build/bin/llama-server

# Shortcuts for long paths, used as ${name} below.
vars:
  llama: ~/Documents/Code/llama.cpp
  models: ~/Documents/Models

# Address llama-server listens on (each model picks its own port).
host: 127.0.0.1

# Directory llama-server runs in. Relative model paths resolve against it.
# Defaults to the directory of this file.
# working_dir: ${llama}

# Arguments given to every model, before the model's own `args`.
common_args:
  -fa: on
  --no-warmup: true

# Command used to open the web UI. Defaults to xdg-open.
# browser: firefox

# Terminal used for tools marked `new_window: true`. The tool's command is
# appended to this list.
# terminal: [kitty, --]
# terminal: [alacritty, -e]

# Log lines kept in memory per model.
log_lines: 5000

# Each model's llama-server output is also appended, with timestamps, to
# <log_dir>/<model-name>.log. Defaults to `logs` next to this file; set it to
# "" to turn log files off.
# log_dir: ~/.local/state/lamasery

# Each model is one llama-server instance. `model` and `port` become
# -m / --port; `host` above becomes --host.
#
# Other llama-server flags go under `args`, one per line:
#   -c: 32768            a flag and its value
#   --no-warmup: true    a flag without a value
#   --mmap: false        left out (handy to switch a flag off quickly)
#   --lora: [a, b]       a list repeats the flag (--lora a --lora b)
# Quote values containing `: `, `#`, `{` or `[`, e.g. JSON:
#   --chat-template-kwargs: '{"enable_thinking": false}'
#
# You can also write args as a list in shell syntax if you prefer:
#   args:
#     - -c 32768
#     - --no-warmup
models:
  - name: Example 7B
    model: ${models}/example-7b-Q4_K_M.gguf
    port: 8080
    # Name clients use for this model (llama-server --alias).
    alias: example-7b
    args:
      -c: 32768
      -ctk: q8_0
      -ctv: q8_0
      --temp: 0.7
      --chat-template-kwargs: '{"enable_thinking": false}'
    # Extra environment variables for llama-server.
    # env:
    #   CUDA_VISIBLE_DEVICES: "0"

# Tools you can launch against a running model. The model selected in the
# list is the backend. These placeholders are filled in at launch time:
#   ${base_url}  http://host:port         (Anthropic-style APIs)
#   ${api_base}  http://host:port/v1      (OpenAI-style APIs)
#   ${host} ${port}
#   ${model}     the model's alias, or the .gguf file name without extension
#   ${model_name}  the model's name in this file
#   ${tool_dir}  the tool's own folder: <tools_dir>/<tool name in lowercase>
#   ${ctx}       context size per request, read from the running server
#                (accounts for -fit shrinking it), else from -c / -np
#   ${max_output}  the -n value, if set
# An env var whose placeholder can't be filled is left unset.
#
# By default a tool runs in this terminal, above lamasery's status bar, and
# lamasery comes back when it exits; the servers keep running meanwhile.
# Set `new_window: true` to open it in the `terminal` set above instead.
#
# A tool can also be downloaded and configured by lamasery:
#   download:  a pinned release file (url + sha256), fetched into
#              ${tool_dir}/dist on the first launch and again whenever the url
#              or sha256 changes. .tar.gz archives are unpacked; any other
#              file is taken to be the executable itself.
#   files:     config files (paths relative to ${tool_dir}) written at every
#              launch with the placeholders above filled in, so they always
#              match the running model.
# tools_dir defaults to `tools` next to this file:
# tools_dir: ~/.local/share/lamasery/tools
tools:
  - name: Claude Code
    command: claude
    env:
      ANTHROPIC_BASE_URL: ${base_url}
      ANTHROPIC_AUTH_TOKEN: lamasery
      ANTHROPIC_MODEL: ${model}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${model}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${model}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${model}
      CLAUDE_CODE_SUBAGENT_MODEL: ${model}
      # Context size and output cap, so /context and auto-compact are right.
      CLAUDE_CODE_MAX_CONTEXT_TOKENS: ${ctx}
      CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${max_output}
      # Don't send Anthropic-only beta fields llama-server may reject.
      CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      API_TIMEOUT_MS: "3000000"

  # pi (github.com/earendil-works/pi), a lean coding agent, downloaded and
  # configured by lamasery. To update it, put a newer release's url and the
  # sha256 GitHub lists for that file here.
  - name: pi
    download:
      url: https://github.com/earendil-works/pi/releases/download/v1.6.0/pi-linux-x64.tar.gz
      sha256: ef77dbe4379b3bdeb425a1e1b862fa3c915c255000dfe4965c98eee96a5765d1
    command: ${tool_dir}/dist/pi/pi
    args:
      --model: lamasery/${model}
    env:
      # pi's config, sessions and logins stay in ${tool_dir}/agent, not ~/.pi.
      PI_CODING_AGENT_DIR: ${tool_dir}/agent
      # Only the local server: no catalog refreshes, version checks or telemetry.
      PI_OFFLINE: "1"
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
    files:
      agent/models.json: |
        {
          "providers": {
            "lamasery": {
              "baseUrl": "${api_base}",
              "api": "openai-completions",
              "apiKey": "lamasery",
              "compat": { "maxTokensField": "max_tokens" },
              "models": [
                {
                  "id": "${model}",
                  "name": "${model_name}",
                  "contextWindow": ${ctx}
                }
              ]
            }
          }
        }

  # A shell with OpenAI-compatible variables set, for anything else.
  - name: Shell (OpenAI env)
    command: ${SHELL}
    env:
      OPENAI_BASE_URL: ${api_base}
      OPENAI_API_BASE: ${api_base}
      OPENAI_API_KEY: lamasery
      OPENAI_MODEL: ${model}

  # - name: Aider
  #   command: aider
  #   args:
  #     --model: openai/${model}
  #   env:
  #     OPENAI_API_BASE: ${api_base}
  #     OPENAI_API_KEY: lamasery
